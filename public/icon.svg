<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle circular glow -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 8" opacity="0.3" />

  <!-- Central Search Pin & Compass Badge -->
  <g filter="url(#shadow)">
    <!-- Pin outer ring -->
    <circle cx="256" cy="224" r="108" fill="#0f172a" stroke="url(#tealGrad)" stroke-width="16" />
    <!-- Pin internal core -->
    <circle cx="256" cy="224" r="70" fill="url(#tealGrad)" opacity="0.15" />

    <!-- Magnifying Glass / Location Pin Hybrid Point -->
    <path d="M 256 332 L 232 376 C 244 388 268 388 280 376 Z" fill="url(#tealGrad)" />

    <!-- Modern Arabic & Latin "W" / Algerian Crescent Hint -->
    <path d="M 210 210 C 210 250 240 266 256 266 C 272 266 302 250 302 210 C 302 184 286 166 256 166 C 226 166 210 184 210 210 Z" 
          fill="none" stroke="url(#tealGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Central Bright Star/Compass Point -->
    <polygon points="256,192 263,212 284,212 267,224 273,244 256,232 239,244 245,224 228,212 249,212" fill="#38bdf8" />
  </g>

  <!-- Platform Name Text: WIN DZ -->
  <text x="256" y="440" font-family="'Cairo', system-ui, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">WIN DZ</text>
  <text x="256" y="474" font-family="'Cairo', system-ui, sans-serif" font-size="20" font-weight="700" fill="#2dd4bf" text-anchor="middle">وين نلقاها؟</text>
</svg>
